<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V30 Sessions Test</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:12px}
.box{background:#0f172a;border:2px solid #22c55e;padding:12px;border-radius:12px}
.row{display:flex;justify-content:space-between;padding:10px;background:#1e293b;border-radius:10px;margin:6px 0}
.on{background:#22c55e;color:white}
.best{background:#f59e0b;color:black}
</style>
</head>
<body>
<h2>🎯 V30 - SESSIONS TEST - If clock ticks, JS works</h2>
<div class="box">
<b>🕐 TIME SESSIONS - KENYA</b>
<div style="font-size:28px;font-weight:bold" id="clock">--:--:--</div>
<div id="day">Loading...</div>
<div id="badge" style="font-weight:bold;margin-top:8px">Checking...</div>
<div id="list"></div>
<div id="count" style="background:#f59e0b;color:black;padding:10px;border-radius:10px;margin-top:10px;text-align:center;font-weight:bold">Starting...</div>
</div>
<p>If clock stays --:--:--, JS is blocked. If clock ticks, JS works.</p>
<script>
function pad(n){return n<10?'0'+n:''+n;}
function tick(){
  var d=new Date();
  var h=(d.getUTCHours()+3)%24;
  var m=d.getUTCMinutes();
  var s=d.getUTCSeconds();
  var day=d.getUTCDay();
  if(d.getUTCHours()+3>=24) day=(day+1)%7;
  var mins=h*60+m;
  var time=pad(h)+':'+pad(m)+':'+pad(s);
  document.getElementById('clock').textContent=time;
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('day').textContent=days[day]+' Kenya';
  var isSydney=mins>=0&&mins<540;
  var isTokyo=mins>=180&&mins<720;
  var isLondon=mins>=600&&mins<1140;
  var isNY=mins>=900&&mins<1440;
  var isOverlap=mins>=900&&mins<1140;
  var cur='';
  if(day===6) cur='❌ SATURDAY CLOSED';
  else if(day===0&&mins<1380) cur='❌ SUNDAY CLOSED';
  else if(isOverlap) cur='🔥 OVERLAP BEST';
  else if(isLondon) cur='🇬🇧 LONDON GOOD';
  else if(isNY) cur='🗽 NEW YORK GOOD';
  else if(isTokyo) cur='🗼 TOKYO SLOW';
  else if(isSydney) cur='🌏 SYDNEY VERY SLOW';
  else cur='OFF';
  document.getElementById('badge').textContent=cur;
  var rows=[
    ['🌏 SYDNEY','12am-9am',isSydney&&!isTokyo,false],
    ['🗼 TOKYO','3am-12pm',isTokyo,false],
    ['🇬🇧 LONDON','10am-7pm',isLondon&&!isOverlap,false],
    ['🗽 NEW YORK','3pm-12am',isNY&&!isOverlap,false],
    ['🔥 OVERLAP','3pm-7pm',isOverlap,true]
  ];
  var html='';
  for(var i=0;i<rows.length;i++){
    var cls='row';
    if(rows[i][2]&&rows[i][3]) cls='row best';
    else if(rows[i][2]) cls='row on';
    html+='<div class="'+cls+'"><b>'+rows[i][0]+' '+rows[i][1]+'</b><b>'+(rows[i][2]?'● LIVE NOW':'○ OFF')+'</b></div>';
  }
  document.getElementById('list').innerHTML=html;
  var cd=document.getElementById('count');
  if(day===6) cd.textContent='SATURDAY - Closed';
  else if(isOverlap) cd.textContent='OVERLAP LIVE - Ends in '+(1140-mins)+' mins - TRADE NOW';
  else if(mins<600) cd.textContent='LONDON OPENS IN '+Math.floor((600-mins)/60)+'h '+((600-mins)%60)+'m';
  else if(mins<900) cd.textContent='OVERLAP IN '+Math.floor((900-mins)/60)+'h '+((900-mins)%60)+'m';
  else cd.textContent='New York only';
}
tick();
setInterval(tick,1000);
</script>
</body>
</html>
